<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireCal API documentation</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { background: #1d1f24; color: #fff; padding: 10px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .bar b { font-size: 16px; }
  .bar a { color: #aef0d6; }
  .note { background: #fdf6e3; border-bottom: 1px solid #eadfbf; padding: 8px 18px; font-size: 13px; color: #5c4a12; }
  .note code { background: #f3ead0; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="bar"><b>FireCal API</b><span>Harmonized MODIS + VIIRS hotspots</span>
  <a href="./">← back to the app</a><a href="https://github.com/Putskev/firecal">GitHub</a></div>
<div class="note" id="note">Static copy of the documentation. To send real requests (<b>Try it out</b>), run the backend
  (<code>python -m uvicorn backend.main:app</code>) and open <code>http://localhost:8000/docs</code>,
  or add <code>?api=https://your-backend</code> to this page's address.</div>
<div id="swagger"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
  const api = new URLSearchParams(location.search).get('api');
  const live = !!api;
  if (live) document.getElementById('note').innerHTML = `Live mode: requests go to <code>${api.replace(/</g, '&lt;')}</code>.`;
  SwaggerUIBundle({
    url: live ? api.replace(/\/$/, '') + '/openapi.json' : 'docs/openapi.json',
    dom_id: '#swagger',
    deepLinking: true,
    supportedSubmitMethods: live ? ['get', 'post'] : [],
    defaultModelsExpandDepth: 0,
  });
</script>
</body>
</html>
